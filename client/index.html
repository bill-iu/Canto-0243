<!doctype html>
<html lang="zh-Hant" data-landing="a">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="粵語填詞查詢工具 - 依 0243 數字碼搜尋可替換詞條" />
    <meta name="theme-color" content="#EBDFD0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Canto-0243" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Canto-0243 ONE·搵·韻</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/pwa-boot-gate.css" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('canto-theme');
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme;
          }
        } catch (_) {}
        try {
          if (sessionStorage.getItem('canto-pwa-gate-landed')) {
            document.documentElement.classList.add('pwa-shell-revealed');
          }
        } catch (_) {}
      })();
    </script>
    <!-- Preload critical display fonts for hero and about slogans to prevent system fallback -->
    <link rel="preload" href="/fonts/PlayfairDisplay-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CantoCriticalSerif-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CantoCriticalSerif-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CantoCriticalSerif-700.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        const root = document.documentElement;
        const markReady = () => {
          if (root.classList.contains('fonts-ready')) return;
          root.classList.add('fonts-ready');
          window.__gateBrandShownAt = performance.now();
        };
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(markReady).catch(markReady);
        } else {
          markReady();
        }
        window.setTimeout(markReady, 2400);
      })();
    </script>
  </head>
  <body class="query-tabs-app">
    <svg class="svg-defs" aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden" focusable="false">
      <defs>
        <filter id="brush-roughen-brand" x="-8%" y="-120%" width="116%" height="340%">
          <feTurbulence type="fractalNoise" baseFrequency="0.042 0.38" numOctaves="4" seed="7" result="turb"/>
          <feDisplacementMap in="SourceGraphic" in2="turb" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <path id="brand-ink-blob-path" d="M4 55.5 C14 54.9 24 55.1 34 55.7 C44 56.3 52 56.7 60 56.5 C68 57.9 76 58.5 84 57.3 C92 55.2 98 52.8 104 51.2 C106.5 50.4 110 49.6 114 48.8 C118 47.6 122 47.2 126 46.8 C128 46.5 130 46.2 132 45.9 C133.5 45.6 134.5 45.4 135 45.2 L135.1 45.8 L134.6 46.3 L133.8 46.8 L132.6 47.3 L130.8 47.8 L128.5 48.2 C96 55.3 80 60.5 62 61.8 C46 62.3 30 60.3 18 57.3 C10 55.3 5 53.5 4 55.5 Z"/>
        <symbol id="brand-wordmark" viewBox="0 0 200 72" overflow="visible">
          <text x="4" y="50" font-family="'Noto Serif TC', serif" font-size="44" font-weight="900" fill="#1C1917">粵</text>
          <text x="62" y="28" font-family="'Noto Serif TC', serif" font-size="12" font-weight="900" fill="#9F1239" letter-spacing="2.2">CANTO</text>
          <text x="62" y="48" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="600" fill="#1C1917" letter-spacing="1">0243</text>
        </symbol>
        <symbol id="brand-ink-blob" viewBox="0 0 200 72" overflow="visible">
          <use href="#brand-ink-blob-path"/>
        </symbol>
        <symbol id="brand-ink-flicks" viewBox="0 0 200 72" overflow="visible">
          <path d="M133.5 47.0 L135.0 45.5" stroke="#9F1239" stroke-width="0.9" stroke-linecap="round"/>
          <path d="M132.2 48.4 L133.6 49.2" stroke="#9F1239" stroke-width="0.65" stroke-linecap="round"/>
          <path d="M134.2 46.2 L135.2 44.9" stroke="#9F1239" stroke-width="0.5" stroke-linecap="round"/>
          <path d="M132.8 47.6 L134.0 48.4" stroke="#9F1239" stroke-width="0.4" stroke-linecap="round"/>
          <path d="M134.0 46.6 L135.0 45.8" stroke="#9F1239" stroke-width="0.3" stroke-linecap="round"/>
        </symbol>
      </defs>
    </svg>
    <div id="pwaBootGate" class="pwa-boot-gate" role="status" aria-live="polite" aria-busy="true">
      <div class="gate-brand">
        <svg class="brand-logo brand-logo--gate" xmlns="http://www.w3.org/2000/svg" width="200" height="72" viewBox="0 0 200 72" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="boot-gate-ink-clip">
              <rect class="gate-ink-clip-rect" x="0" y="0" width="0" height="72"/>
            </clipPath>
          </defs>
          <use href="#brand-wordmark"/>
          <g class="gate-ink-track" aria-hidden="true">
            <use href="#brand-ink-blob" fill="#9F1239" filter="url(#brush-roughen-brand)"/>
            <use href="#brand-ink-flicks" filter="url(#brush-roughen-brand)"/>
          </g>
          <g class="gate-ink-fill" clip-path="url(#boot-gate-ink-clip)" aria-hidden="true">
            <use href="#brand-ink-blob" fill="#9F1239" filter="url(#brush-roughen-brand)"/>
            <use href="#brand-ink-flicks" filter="url(#brush-roughen-brand)"/>
          </g>
        </svg>
      </div>
      <svg class="gate-ink-meter" xmlns="http://www.w3.org/2000/svg" viewBox="0 38 200 34" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="boot-gate-ink-clip-mini">
            <rect class="gate-ink-clip-rect" x="0" y="38" width="0" height="34"/>
          </clipPath>
        </defs>
        <g class="gate-ink-track" aria-hidden="true">
          <use href="#brand-ink-blob" fill="#9F1239" filter="url(#brush-roughen-brand)"/>
          <use href="#brand-ink-flicks" filter="url(#brush-roughen-brand)"/>
        </g>
        <g class="gate-ink-fill" clip-path="url(#boot-gate-ink-clip-mini)" aria-hidden="true">
          <use href="#brand-ink-blob" fill="#9F1239" filter="url(#brush-roughen-brand)"/>
          <use href="#brand-ink-flicks" filter="url(#brush-roughen-brand)"/>
        </g>
      </svg>
      <p class="pwa-boot-gate__status">執緊啲字…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
