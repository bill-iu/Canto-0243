<!doctype html>
<html lang="zh-Hant" data-landing="a">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="粵語填詞查詢工具 - 依 0243 數字碼搜尋可替換詞條" />
    <meta name="theme-color" content="#EBDFD0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Canto-0243" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Canto-0243 ONE·搵·韻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        const root = document.documentElement;
        const markReady = () => {
          if (root.classList.contains('fonts-ready')) return;
          root.classList.add('fonts-ready');
          window.__gateBrandShownAt = performance.now();
        };
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(markReady).catch(markReady);
        } else {
          markReady();
        }
        window.setTimeout(markReady, 2400);
      })();
    </script>
  </head>
  <body class="query-tabs-app">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
