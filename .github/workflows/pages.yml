name: Pages (PWA)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Existing release tag with lyrics.db (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release source is current
        run: |
          git fetch origin main dev --quiet
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Pages deploy must be dispatched from main after dev has been merged."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag commit must be reachable from origin/main."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/dev origin/main; then
            echo "::error::origin/dev is not merged into origin/main. Merge dev first, then redeploy Pages."
            exit 1
          fi

      - name: Download lexicon (lyrics.db) from this release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.target_tag || github.ref_name }}
        run: |
          gh release download "$TAG" -p "lyrics.db" --clobber
          test -s lyrics.db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch rime char.csv for PWA prebuild
        run: python scripts/fetch/fetch_rime_data.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build PWA bundle
        working-directory: client
        env:
          RELEASE_TAG: ${{ inputs.target_tag || github.ref_name }}
          VITE_LEXICON_VERSION: ${{ inputs.target_tag || github.ref_name }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

