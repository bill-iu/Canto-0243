name: Sync Version to README

on:
  release:
    types: [published]  # 只在正式發布時觸發（非草稿建立）
  workflow_dispatch:    # 允許手動觸發

jobs:
  sync-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          # release event 的 github.ref 是 tag ref（detached HEAD），
          # 必須 checkout main 才能在有效分支上提交並推送
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync version
        run: python scripts/sync-version.py

      - name: Check if files changed
        id: verify
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md docs/README.*.md
          git commit -m "chore: Sync version to latest release"
          git push origin ${{ github.event.repository.default_branch }}
