name: Release (lexicon) [retired]

# Retired: independent lexicon-only releases are removed (ADR-0044 §5).
# Ship lexicon changes via a new semver full release (build-db locally, then
# scripts/release-windows-local.ps1 -Upload). Program-only fixes: refresh the
# same tag without re-uploading lyrics.db (see docs/release.md).

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'Type retired to confirm you read the message'
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Fail — lexicon-only release retired
        run: |
          echo "::error::Independent lexicon release is retired (ADR-0044)."
          echo "New lexicon → new semver full release: local build-db + release-windows-local.ps1 -Upload"
          echo "Code-only → refresh same tag (reuse lyrics.db; do not delete Release lexicon assets)"
          echo "See docs/release.md"
          if [[ "${{ inputs.acknowledge }}" != "retired" ]]; then
            echo "::error::Type acknowledge=retired if you only wanted to read this."
          fi
          exit 1
