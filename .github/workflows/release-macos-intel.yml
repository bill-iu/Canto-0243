name: Release (macOS Intel tar)

# ponytail: workflow_dispatch — x86_64 tar after Windows publisher uploads zip+db.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.4)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-upload-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Download lyrics.db from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release download "$TAG" --pattern "lyrics.db" --clobber
          test -s lyrics.db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build portable UI (/app)
        working-directory: client
        run: |
          npm ci
          npm run build:portable
          test -f dist-portable/index.html

      - name: Build macOS x86_64 portable tar.gz
        run: |
          export SKIP_README_SYNC=1
          export PORTABLE_MACOS_ARCH=x86_64
          bash scripts/build-portable.sh
          test -f dist/canto-0243-portable-macos-x86_64.tar.gz
        env:
          PYTHONUTF8: "1"

      - name: Upload macOS Intel tar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release upload "$TAG" \
            dist/canto-0243-portable-macos-x86_64.tar.gz \
            --clobber
          echo "Uploaded x86_64 tar to ${TAG}"