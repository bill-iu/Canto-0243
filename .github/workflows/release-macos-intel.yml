name: Release (macOS Intel tar)

# ponytail: workflow_dispatch — x86_64 tar after Windows publisher uploads zip+db.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.1.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-upload-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build portable UI (/app)
        working-directory: client
        run: |
          npm ci
          npm run build:portable
          test -f dist-portable/index.html

      - name: Build macOS x86_64 Desktop app
        env:
          PYTHONUTF8: "1"
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/release-macos-local.sh --tag "$RELEASE_TAG" --arch x86_64
          test -s dist/canto-0243-desktop-macos-x86_64.tar.gz
          test -s dist/portable-manifest-macos-x86_64.json
          test -x dist/canto-0243-desktop/Canto-0243.app/Contents/MacOS/Canto-0243
          codesign --verify --deep --strict dist/canto-0243-desktop/Canto-0243.app

      - name: Upload macOS Intel tar to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/canto-0243-desktop-macos-x86_64.tar.gz \
            dist/portable-manifest-macos-x86_64.json \
            --clobber
          echo "Uploaded Desktop x86_64 tar to ${RELEASE_TAG}"
