name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        env:
          PYTHONUTF8: "1"

      - name: Bootstrap CI lexicon data
        run: cp data/rime/fixtures/char_sample.csv data/rime/char.csv

      - name: Smoke tests
        run: python -m unittest discover -s tests/smoke -q
        env:
          PYTHONUTF8: "1"

      - name: Architecture seam checks
        run: python scripts/check_seams.py -q
        env:
          PYTHONUTF8: "1"

      - name: Guide example regression (Python)
        run: python -m unittest tests.test_guide_example_queries -q
        env:
          PYTHONUTF8: "1"
          DATABASE_URL: sqlite:///./tests/fixtures/lyrics.db
          READINESS_GATE_ENFORCE: "0"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install PWA dependencies
        run: npm ci
        working-directory: client

      - name: Build portable host (/app)
        run: npm run build:portable
        working-directory: client


      - name: Client self-checks (C9 harness, tag=ci)
        run: npm run self-check:ci
        working-directory: client
