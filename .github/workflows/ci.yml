name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Fast: run on every push and PR — tsc + self-check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: client
      - run: npm run self-check:ci
        working-directory: client

  # Full: Python smoke + build + tsc + self-check — only on PR and push to main
  full:
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          pip install -r requirements.txt
          pip install pyyaml httpx
        env:
          PYTHONUTF8: "1"
      - run: cp data/rime/fixtures/char_sample.csv data/rime/char.csv
      - run: python -m unittest discover -s tests/smoke -q
        env:
          PYTHONUTF8: "1"
      - run: python scripts/check_seams.py -q
        env:
          PYTHONUTF8: "1"
      - run: python -m unittest tests.test_guide_example_queries -q
        env:
          PYTHONUTF8: "1"
          DATABASE_URL: sqlite:///./tests/fixtures/lyrics.db
          READINESS_GATE_ENFORCE: "0"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build:portable
        working-directory: client
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: client
      - run: npm run self-check:ci
        working-directory: client
