# Lexicon SSOT manifest (CONTEXT: lexicon source manifest)
# enabled: include in `python -m ingest build-db` without --lexicon-source

sources:
  - id: rime
    type: rime
    parser: rime_char
    license: CC-BY-4.0
    enabled_by_default: true
    raw_path: data/rime/char.csv
    source_rank: 100
    attribution: CanCLID/rime-cantonese-upstream char.csv

  - id: words_hk
    type: lexicon_json
    parser: words_hk_wordslist
    license: public-domain
    enabled_by_default: true
    local_only: true
    raw_path: data/lexicon/raw/words_hk/wordslist.json
    source_rank: 90
    attribution: words.hk wordslist

  - id: kaifang
    type: lexicon_json
    parser: kaifang_txt
    license: CC-BY-3.0
    enabled_by_default: true
    local_only: true
    raw_path: data/lexicon/raw/kaifang/cantonese.json
    source_rank: 80
    attribution: kaifangcidian cantonese.json

  - id: curated
    type: lexicon_json
    parser: lexicon_json
    license: project
    enabled_by_default: true
    raw_path: data/lexicon/curated_lexicon.json
    source_rank: 20
    attribution: Maintainer curated lexicon readings

  - id: rime_words
    type: lexicon_csv
    parser: rime_upstream_csv
    license: CC-BY-4.0
    enabled_by_default: true
    local_only: true
    raw_path: data/lexicon/raw/rime-cantonese-upstream/word.csv
    source_rank: 10
    attribution: CanCLID/rime-cantonese-upstream lexical CSV categories (proper nouns excluded)

  - id: hsk30
    type: wordlist
    parser: hsk30_wordlist
    license: MIT
    enabled_by_default: true
    local_only: true
    raw_path: data/lexicon/raw/hsk30/wordlist.txt
    source_rank: 5
    attribution: elkmovie/hsk30 wordlist.txt

  - id: rime_phrase
    type: rime_dict
    parser: rime_phrase_yaml
    license: CC-BY-4.0
    enabled_by_default: false
    local_only: true
    raw_path: data/lexicon/raw/rime-cantonese/jyut6ping3.phrase.dict.yaml
    allowlist_path: data/lexicon/raw/rime-cantonese/jyut6ping3.phrase.8char-allowlist.txt
    reject_suffixes_path: data/lexicon/raw/rime-cantonese/jyut6ping3.phrase.reject-suffixes.txt
    reject_literals_path: data/lexicon/raw/rime-cantonese/jyut6ping3.phrase.reject-literals.txt
    source_rank: 3
    attribution: rime/rime-cantonese jyut6ping3.phrase.dict.yaml
